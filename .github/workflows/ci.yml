name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Tests
        # Dummy key: the suite doesn't call the Gemini API (the agent uses
        # defer_model_check=True), but the value needs to exist in the
        # environment so load_dotenv() in desk/extraction.py doesn't leave
        # the variable missing.
        env:
          GOOGLE_API_KEY: dummy-key-for-ci
        run: uv run pytest
