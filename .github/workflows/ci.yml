name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency audit, Mondays at 06:00 UTC. New CVEs get disclosed
    # against transitive dependencies regardless of whether this repository
    # changed, so the audit needs its own cadence.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Dummy key: the suite doesn't call the Gemini API (the agent uses
    # defer_model_check=True), but the value needs to exist in the
    # environment so load_dotenv() in config/settings.py doesn't leave
    # the variable missing.
    env:
      GOOGLE_API_KEY: dummy-key-for-ci
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        # --frozen: fail if uv.lock is out of date with pyproject.toml instead
        # of silently resolving something different from what runs locally.
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    # Advisory, not blocking: the findings are almost always CVEs in transitive
    # dependencies with no relation to a given pull request. Blocking merges on
    # them means an unrelated disclosure freezes the whole repository.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit
